<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02030A">
<title>Panel de Rair ✦</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --fondo: #02030A; --vidrio: rgba(20, 16, 34, .78); --borde: rgba(255, 210, 122, .22); --oro: #FFD27A; --fuego: #FF9A4D; --luz: #F6F1FF; --tenue: #A99FC0; --ok: #7BE0A6; --mal: #FF7A7A; }
  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body { margin: 0; min-height: 100vh; background: radial-gradient(130% 560px at 50% -60px, #2A1650 0%, #0B0820 55%, var(--fondo) 100%) no-repeat var(--fondo); color: var(--luz);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
  .pila { display: grid; gap: 14px; }
  h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: -.01em; }
  h1 span { color: var(--oro); }
  .sub { color: var(--tenue); margin: 0 0 6px; }
  .caja { background: var(--vidrio); border: 1px solid var(--borde); border-radius: 20px; padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .caja h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--fuego); margin: 0 0 10px; font-weight: 700; }
  label { display: block; font-size: 13px; color: var(--tenue); margin: 10px 0 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--luz); background: rgba(255, 255, 255, .06); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; outline: none; }
  input:focus, textarea:focus { border-color: var(--oro); }
  textarea { min-height: 110px; resize: vertical; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; font-weight: 650; min-height: 46px; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--borde); background: rgba(255, 255, 255, .06); color: var(--luz); cursor: pointer; }
  button.oro { background: var(--oro); color: #1A0E02; border-color: transparent; flex: 1; }
  button:disabled { opacity: .55; cursor: default; }
  .estado { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .punto { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--tenue); }
  .punto.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .punto.mal { background: var(--mal); }
  .dato { color: var(--tenue); font-size: 13.5px; margin: 8px 0 0; }
  .noti { margin-top: 12px; background: rgba(255, 255, 255, .92); color: #111; border-radius: 16px; padding: 10px 12px; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
  .noti img { width: 38px; height: 38px; border-radius: 9px; }
  .noti b { display: block; font-size: 14px; }
  .noti p { margin: 2px 0 0; font-size: 14px; line-height: 1.3; white-space: pre-wrap; word-break: break-word; }
  .cuenta { text-align: right; font-size: 12px; color: var(--tenue); margin-top: 4px; }
  .msg { min-height: 22px; font-size: 14px; margin: 10px 0 0; }
  .msg.ok { color: var(--ok); } .msg.mal { color: var(--mal); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { border-top: 1px solid rgba(255, 255, 255, .08); padding-top: 10px; }
  li small { color: var(--tenue); display: block; }
  .equipos { margin-top: 12px; }
  .equipos li { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .equipos button { min-height: 38px; padding: 7px 14px; font-size: 13.5px; color: var(--mal); border-color: rgba(255, 122, 122, .35); }
  [hidden] { display: none !important; }
  .salir { background: none; border: none; color: var(--tenue); text-decoration: underline; min-height: 0; padding: 4px; justify-self: center; font-weight: 500; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Panel de Rair <span>✦</span></h1>
    <p class="sub">Desde aquí le llegan tus mensajes a Chonte como notificación.</p>
  </header>

  <section class="caja" id="entrar">
    <h2>Entrar</h2>
    <label for="clave">Tu clave</label>
    <input id="clave" type="password" autocomplete="current-password" placeholder="chonte-…">
    <div class="fila"><button class="oro" id="btnEntrar">Entrar</button></div>
    <p class="msg" id="msgEntrar"></p>
  </section>

  <div id="panel" class="pila" hidden>
      <section class="caja">
        <h2>Su teléfono</h2>
        <div class="estado"><span class="punto" id="punto"></span><span id="estado">Revisando…</span></div>
        <p class="dato" id="detalle"></p>
        <ul class="equipos" id="equipos"></ul>
      </section>

      <section class="caja">
        <h2>Mandarle algo ahorita</h2>
        <label for="titulo">Título (opcional)</label>
        <input id="titulo" maxlength="60" placeholder="Rair ✦">
        <label for="texto">Mensaje</label>
        <textarea id="texto" maxlength="300" placeholder="¿Cómo estás tan curiosa? …jaja es mentira 😏"></textarea>
        <div class="cuenta"><span id="cuenta">0</span>/300</div>
        <div class="noti" aria-hidden="true"><img src="icon-192.png" alt=""><div><b id="vTitulo">Rair ✦</b><p id="vTexto">Así se le va a ver en su pantalla.</p></div></div>
        <div class="fila"><button class="oro" id="btnMandar">Mandar 🚀</button></div>
        <p class="msg" id="msgMandar"></p>
      </section>

      <section class="caja">
        <h2>Mensaje del día</h2>
        <p id="deHoy" style="margin:0">—</p>
        <p class="dato" id="ultimo"></p>
        <div class="fila"><button id="btnHoy">Reenviarle el de hoy</button></div>
        <p class="msg" id="msgHoy"></p>
      </section>

      <section class="caja" id="cajaHistorial" hidden>
        <h2>Lo que le has mandado</h2>
        <ul id="historial"></ul>
      </section>

      <button class="salir" id="salir">Salir de este teléfono</button>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const leerClave = () => { try { return localStorage.getItem('rair_clave') || ''; } catch { return ''; } };
  const guardarClave = (v) => { try { v ? localStorage.setItem('rair_clave', v) : localStorage.removeItem('rair_clave'); } catch { /* sin almacenamiento */ } };
  const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const diaTxt = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' }); };
  let clave = leerClave();

  async function api(metodo, cuerpo) {
    const r = await fetch('/api/rair', { method: metodo, headers: { 'x-clave': clave, ...(cuerpo ? { 'Content-Type': 'application/json' } : {}) }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(datos.error || `Error ${r.status}`); e.status = r.status; throw e; }
    return datos;
  }
  const msg = (id, txt, tipo) => { const el = $(id); el.textContent = txt; el.className = `msg ${tipo || ''}`; };

  function pintar(d) {
    const n = d.dispositivos.length;
    $('punto').className = `punto ${n ? 'ok' : 'mal'}`;
    $('estado').textContent = n ? `Tiene los avisos activados ✓` : 'Todavía no activa las notificaciones';
    $('detalle').textContent = n
      ? (n > 1 ? `${n} teléfonos. Si uno es el tuyo de prueba, quítalo.` : 'Si este es tu cel de prueba, quítalo para que no te lleguen sus mensajes.')
      : 'Pídele que abra la app y toque 🔔 (en iPhone: primero Compartir → Agregar a inicio, y abrirla desde ahí).';
    $('equipos').replaceChildren(...d.dispositivos.map((x) => {
      const li = document.createElement('li'), t = document.createElement('span'), q = document.createElement('button');
      t.textContent = `📱 ${x.equipo} · desde ${fecha(x.alta)}`;
      q.textContent = 'Quitar'; q.addEventListener('click', () => quitar(x, q));
      li.append(t, q); return li;
    }));
    const t = d.deHoy?.texto || '';
    $('deHoy').textContent = d.deHoy ? (/^Día \d+/.test(t) ? t : `Día ${d.deHoy.dia}: ${t}`) : 'Cuando active los avisos aquí vas a ver el mensaje que le toca hoy.';
    $('ultimo').textContent = d.ultimo ? `Último envío: ${diaTxt(d.ultimo.fecha)}, ${new Date(d.ultimo.hora).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' })} · llegó a ${d.ultimo.enviados} de ${d.ultimo.total}` : 'Sale solito cada día a las 9:00 am (hora de Zacatecas).';
    $('btnMandar').disabled = $('btnHoy').disabled = !n;
    $('cajaHistorial').hidden = !d.historial.length;
    $('historial').replaceChildren(...d.historial.map((h) => {
      const li = document.createElement('li'), s = document.createElement('small');
      s.textContent = `${fecha(h.fecha)} · ${h.titulo} · ${h.enviados ? 'entregado ✓' : 'no llegó'}`;
      li.append(s, document.createTextNode(h.texto));
      return li;
    }));
  }

  async function cargar() {
    try { pintar(await api('GET')); $('entrar').hidden = true; $('panel').hidden = false; }
    catch (e) {
      $('entrar').hidden = false; $('panel').hidden = true;
      if (e.status === 401) { const escribio = !!$('clave').value; guardarClave(''); clave = ''; msg('msgEntrar', escribio ? 'Esa clave no es 🙈' : '', 'mal'); }
      else msg('msgEntrar', e.message, 'mal');
    }
  }

  $('btnEntrar').addEventListener('click', async () => {
    clave = $('clave').value.trim(); if (!clave) return;
    $('btnEntrar').disabled = true; await cargar(); $('btnEntrar').disabled = false;
    if (!$('panel').hidden) guardarClave(clave);
  });
  $('clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnEntrar').click(); });

  const vista = () => { $('vTitulo').textContent = $('titulo').value.trim() || 'Rair ✦'; $('vTexto').textContent = $('texto').value.trim() || 'Así se le va a ver en su pantalla.'; $('cuenta').textContent = $('texto').value.length; };
  $('titulo').addEventListener('input', vista); $('texto').addEventListener('input', vista);

  $('btnMandar').addEventListener('click', async () => {
    const texto = $('texto').value.trim(); if (!texto) return msg('msgMandar', 'Escribe algo primero 😅', 'mal');
    $('btnMandar').disabled = true; msg('msgMandar', 'Mandando…');
    try {
      const r = await api('POST', { titulo: $('titulo').value, texto });
      if (r.enviados) { msg('msgMandar', 'Le llegó ✦', 'ok'); $('texto').value = ''; vista(); } else msg('msgMandar', 'No le llegó: puede que haya quitado el permiso 😕', 'mal');
      await cargar();
    } catch (e) { msg('msgMandar', e.message, 'mal'); }
    $('btnMandar').disabled = false;
  });

  async function quitar(x, boton) {
    if (!confirm(`¿Quitar el ${x.equipo} dado de alta el ${fecha(x.alta)}? Ya no le llegarán los mensajes a ese teléfono.`)) return;
    boton.disabled = true;
    try { await api('POST', { accion: 'quitar', id: x.id }); await cargar(); } catch (e) { alert(e.message); boton.disabled = false; }
  }

  $('btnHoy').addEventListener('click', async () => {
    if (!confirm('¿Reenviarle el mensaje de hoy? Si ya le llegó, le va a llegar otra vez.')) return;
    $('btnHoy').disabled = true; msg('msgHoy', 'Mandando…');
    try { const r = await api('POST', { accion: 'hoy' }); msg('msgHoy', r.enviados ? 'Listo ✦' : 'No le llegó 😕', r.enviados ? 'ok' : 'mal'); await cargar(); }
    catch (e) { msg('msgHoy', e.message, 'mal'); }
    $('btnHoy').disabled = false;
  });

  $('salir').addEventListener('click', () => { guardarClave(''); clave = ''; $('clave').value = ''; $('panel').hidden = true; $('entrar').hidden = false; msg('msgEntrar', ''); });

  if (clave) cargar();
</script>
</body>
</html>
